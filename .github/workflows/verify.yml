name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full verification
        id: verify
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts, reports | Out-Null
          npm run verify 2>&1 | Tee-Object -FilePath artifacts/verify.log
          $verifyExitCode = $LASTEXITCODE
          if ($verifyExitCode -ne 0) {
            exit $verifyExitCode
          }
      - name: Upload verification failure logs
        if: always() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: DailyLoopRunner-verification-failure-${{ github.run_id }}
          path: |
            artifacts/verify.log
            reports/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload JUnit test report
        if: always() && hashFiles('reports/junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: DailyLoopRunner-junit-${{ github.run_id }}
          path: reports/junit.xml
          retention-days: 14
      - name: Build Profile library
        id: profiles
        run: npm run build:profiles
      - name: Check generated compatibility userscript is committed
        id: compatibility
        run: git diff --exit-code -- DailyLoopRunner.user.js
      - name: Upload Profile library preview
        uses: actions/upload-artifact@v7
        with:
          name: DailyLoopRunner-profiles
          path: dist/profiles
      - name: Write verification summary
        if: always()
        shell: pwsh
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PROFILES_OUTCOME: ${{ steps.profiles.outcome }}
          COMPATIBILITY_OUTCOME: ${{ steps.compatibility.outcome }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $testFiles = 'Not run'
          $tests = 'Not run'
          $passed = 'Not run'
          $failed = 'Not run'
          $skipped = 'Not run'

          if (Test-Path -LiteralPath reports/junit.xml) {
            try {
              [xml]$junit = Get-Content -LiteralPath reports/junit.xml -Raw
              $root = $junit.testsuites
              $testFiles = @($root.testsuite).Count
              $tests = [int]$root.tests
              $failed = [int]$root.failures + [int]$root.errors
              $skipped = (@($root.testsuite) | Measure-Object -Property skipped -Sum).Sum
              if ($null -eq $skipped) {
                $skipped = 0
              }
              $passed = $tests - $failed - [int]$skipped
            } catch {
              $testFiles = 'Report parse failed'
              $tests = 'Report parse failed'
              $passed = 'Report parse failed'
              $failed = 'Report parse failed'
              $skipped = 'Report parse failed'
            }
          }

          $outcomes = @($env:VERIFY_OUTCOME, $env:PROFILES_OUTCOME, $env:COMPATIBILITY_OUTCOME)
          $incompleteOutcomes = @($outcomes | Where-Object { $_ -ne 'success' })
          $overall = if ($incompleteOutcomes.Count -eq 0) { 'Passed' } else { 'Failed' }
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          @"
          ## DailyLoopRunner verification

          | Field | Result |
          | --- | --- |
          | Version | ``$version`` |
          | Commit | ``$shortSha`` |
          | Trigger | ``$env:GITHUB_EVENT_NAME`` |
          | Overall | **$overall** |
          | Full verification | ``$env:VERIFY_OUTCOME`` |
          | Profile build | ``$env:PROFILES_OUTCOME`` |
          | Compatibility userscript | ``$env:COMPATIBILITY_OUTCOME`` |
          | Test files | $testFiles |
          | Tests | $tests |
          | Passed | $passed |
          | Failed | $failed |
          | Skipped | $skipped |
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
